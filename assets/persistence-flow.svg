<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="How a completed task becomes a Git commit" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#08090c"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
    <clipPath id="clip"><rect width="1200" height="440" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <text x="40" y="42" font-size="13" font-weight="700" letter-spacing="2" fill="#fbbf24">ONE TICK ON A ROADMAP = ONE REAL COMMIT</text>
    <text x="40" y="62" font-size="12" fill="#94a3b8">No database. The same storage adapter writes to disk in development and to GitHub in production.</text>

    <g stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M215 150H265"/><path d="M455 150H505"/><path d="M695 150H745"/>
      <path d="M840 185V235"/>
      <path d="M840 295L560 345"/><path d="M840 295L1010 345"/>
    </g>
    <circle r="6" fill="#fbbf24"><animateMotion dur="5s" repeatCount="indefinite" path="M40 150H940"/></circle>
    <circle r="6" fill="#818cf8"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M40 150H940"/></circle>
    <circle r="5" fill="#34d399"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M840 295L1010 345"/></circle>
    <circle r="5" fill="#94a3b8"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M840 295L560 345"/></circle>

    <g font-weight="700" text-anchor="middle">
      <rect x="40" y="115" width="175" height="70" rx="12" fill="#101319" stroke="#fbbf24"/>
      <text x="127" y="146" font-size="15" fill="#fef3c7">Complete a task</text><text x="127" y="167" font-size="12" font-weight="400" fill="#a8a29e">dashboard · daily review</text>

      <rect x="265" y="115" width="190" height="70" rx="12" fill="#101319" stroke="#f472b6"/>
      <text x="360" y="146" font-size="15" fill="#fce7f3">Session check</text><text x="360" y="167" font-size="12" font-weight="400" fill="#a8a29e">signed httpOnly cookie</text>

      <rect x="505" y="115" width="190" height="70" rx="12" fill="#101319" stroke="#a78bfa"/>
      <text x="600" y="146" font-size="15" fill="#ede9fe">Zod validation</text><text x="600" y="167" font-size="12" font-weight="400" fill="#a8a29e">bounds on every field</text>

      <rect x="745" y="115" width="190" height="70" rx="12" fill="#101319" stroke="#818cf8" stroke-width="2.5"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></rect>
      <text x="840" y="146" font-size="15" fill="#e0e7ff">XP + streak + badges</text><text x="840" y="167" font-size="12" font-weight="400" fill="#a8a29e">computed server-side</text>

      <rect x="745" y="235" width="190" height="60" rx="12" fill="#101319" stroke="#6b7280"/>
      <text x="840" y="261" font-size="15" fill="#e5e7eb">Storage adapter</text><text x="840" y="280" font-size="12" font-weight="400" fill="#a8a29e">NODE_ENV decides</text>

      <rect x="360" y="345" width="260" height="64" rx="12" fill="#101319" stroke="#6b7280" stroke-dasharray="5 4"/>
      <text x="490" y="372" font-size="15" fill="#e5e7eb">Development</text><text x="490" y="392" font-size="12" font-weight="400" fill="#a8a29e">writes JSON to local disk</text>

      <rect x="860" y="345" width="300" height="64" rx="12" fill="#0b2e1f" stroke="#34d399" stroke-width="2.5"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" begin="1s" repeatCount="indefinite"/></rect>
      <text x="1010" y="372" font-size="15" fill="#d1fae5">Production</text><text x="1010" y="392" font-size="12" font-weight="400" fill="#6ee7b7">one atomic Git commit → green square</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="16" fill="none" stroke="#1f2937"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
